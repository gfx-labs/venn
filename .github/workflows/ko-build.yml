name: Build and Push Ko Container

on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'

env:
  KO_DOCKER_REPO: ghcr.io/gfx-labs/venn
  CGO_ENABLED: 0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install ko
      uses: ko-build/setup-ko@v0.6

    - name: Log in to GitHub Container Registry
      env:
        GHCR_TOKEN: ${{ github.token }}
      run: |
        printf '%s' "$GHCR_TOKEN" | ko login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

    - name: Build and push container (branch)
      if: github.ref_type == 'branch'
      run: |
        BRANCH=${GITHUB_REF#refs/heads/}
        BRANCH_SAFE=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9-]/-/g')
        SHORT_SHA=${GITHUB_SHA::7}

        ko build --bare ./cmd/venn --tags="${BRANCH_SAFE},${SHORT_SHA}"

    - name: Build and push container (version tag)
      if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG=${GITHUB_REF#refs/tags/}

        ko build --bare ./cmd/venn --tags="$TAG,latest"
